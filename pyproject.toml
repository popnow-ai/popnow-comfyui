[project]
name = "popnow-comfyui"
description = "PopNow for ComfyUI: every PopNow AI video, image and audio model as a node (Kling, Seedance, Wan, MiniMax, Nano Banana, GPT Image, Flux, Suno). No GPU needed."
version = "0.1.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Nothing to install: the nodes use only what ComfyUI already ships (aiohttp, torch, Pillow, NumPy, PyAV).
dependencies = []
keywords = ["comfyui", "comfyui-custom-nodes", "ai-video", "text-to-video", "image-to-video", "text-to-image", "popnow"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://popnow.ai"
Repository = "https://github.com/popnow-ai/popnow-comfyui"
Documentation = "https://popnow.ai/docs/comfyui"
"Bug Tracker" = "https://github.com/popnow-ai/popnow-comfyui/issues"

# ComfyUI Registry metadata. This package is not published to the registry yet; install it from
# GitHub (see README.md).
[tool.comfy]
PublisherId = "popnow"
DisplayName = "PopNow"
Icon = "https://raw.githubusercontent.com/popnow-ai/popnow-comfyui/main/assets/popnow-logo.png"
includes = []

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
