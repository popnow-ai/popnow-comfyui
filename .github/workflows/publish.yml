name: Publish to Comfy Registry

# Runs when a version tag (v1.2.3) is pushed. The tag must match [project].version in pyproject.toml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository_owner == 'popnow-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main, 1.0.1 calls a removed comfy-cli flag
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"
