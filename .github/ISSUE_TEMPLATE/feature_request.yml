name: Feature request
description: Suggest an improvement to the PopNow nodes.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or result you are after.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: A new node, input, output or setting, and how you would use it.
